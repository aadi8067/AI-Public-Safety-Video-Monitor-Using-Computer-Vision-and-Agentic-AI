<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shield body -->
  <path d="M100,10 L174,37 L174,109 C174,154 141,181 100,196
           C59,181 26,154 26,109 L26,37 Z"
        fill="#070c17" stroke="url(#shieldGrad)" stroke-width="6"
        stroke-linejoin="round" filter="url(#glow)"/>

  <!-- AI viewfinder / detection-box corner brackets -->
  <g stroke="url(#shieldGrad)" stroke-width="5.5" stroke-linecap="round" fill="none">
    <path d="M60,64 L60,48 L78,48"/>
    <path d="M140,64 L140,48 L122,48"/>
    <path d="M60,128 L60,144 L78,144"/>
    <path d="M140,128 L140,144 L122,144"/>
  </g>

  <!-- Tracking reticle (person being detected) -->
  <circle cx="100" cy="96" r="21" fill="none" stroke="url(#shieldGrad)" stroke-width="2.5" opacity="0.75"/>
  <circle cx="100" cy="96" r="7.5" fill="url(#shieldGrad)"/>
</svg>
