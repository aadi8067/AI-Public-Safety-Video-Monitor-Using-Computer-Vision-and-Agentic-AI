<div id="results-content" class="fade-in">
  <h3>Detection Results</h3>

  <!-- Centered annotated image -->
  <div class="annotated-image-wrapper">
    <img id="annotatedImage" src="" alt="Annotated Result"
      style="display:none;">
  </div>

  <!-- List of detected objects -->
  <div id="detectionDetails" class="detection-details" style="display:none;">
    <h4>Detected Objects:</h4>
    <ul id="objectList"></ul>
  </div>

  <button id="backBtn" class="try-again-btn">← Try Another Image</button>
</div>
